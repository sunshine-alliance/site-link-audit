name: Site Link Audit

# Run on demand from the Actions tab. No schedule, no secrets, no API cost.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Site URL to crawl (include https://)"
        required: true
        default: "https://www.alliancewoodworking.com"
      max_pages:
        description: "Safety cap on internal pages to crawl"
        required: false
        default: "500"

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run link audit
        run: |
          python crawl_site.py \
            --url "${{ inputs.url }}" \
            --max-pages "${{ inputs.max_pages }}" \
            --out "link_audit.xlsx"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: link-audit-report
          path: link_audit.xlsx
          retention-days: 30
